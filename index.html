 {w:"reusable", ph:"/ˌriːˈjuːzəbl/", cn:"adj. 可重复使用的", ex:"Reusable instruments lower long-term costs.", excn:"可重复使用的器械降低长期成本。"},
 {w:"durable", ph:"/ˈdjʊərəbl/", cn:"adj. 耐用的", ex:"The device housing is durable and shockproof.", excn:"设备外壳坚固耐用且防震。"},
 {w:"ergonomic", ph:"/ˌɜːɡəˈnɒmɪk/", cn:"adj. 人体工学的", ex:"The ergonomic handle fits the hand well.", excn:"人体工学手柄贴合手部。"},
 {w:"accurate", ph:"/ˈækjərət/", cn:"adj. 精准的", ex:"The sensor gives accurate readings.", excn:"传感器读数精准。"},
 {w:"latex-free", ph:"/ˈleɪteks friː/", cn:"adj. 不含乳胶的", ex:"These gloves are latex-free and hypoallergenic.", excn:"这些手套不含乳胶，不易过敏。"},
 {w:"user-friendly", ph:"/ˌjuːzə ˈfrendli/", cn:"adj. 易用的，人性化的", ex:"The user-friendly interface is easy to learn.", excn:"人性化的界面很容易上手。"},
 {w:"calibrated", ph:"/ˈkælɪbreɪtɪd/", cn:"adj. 已校准的", ex:"Each unit is calibrated before shipment.", excn:"每台设备发货前都经过校准。"}
]}
];

/* ═══════════ 发音引擎（浏览器内置语音，无需联网） ═══════════ */
let __voice = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices();
    __voice = vs.find(v=>/^en/i.test(v.lang) && /female|samantha|google|zira|aria/i.test(v.name))
           || vs.find(v=>/^en/i.test(v.lang)) || null;
  }catch(e){}
}
if(typeof speechSynthesis !== "undefined"){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(t, slow){
  if(typeof speechSynthesis === "undefined"){ alert("当前浏览器不支持语音朗读，请用 Chrome / Edge / Safari 打开"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "en-US"; u.rate = slow ? 0.7 : 0.88;
  if(__voice) u.voice = __voice;
  speechSynthesis.speak(u);
}

/* ═══════════ 渲染引擎 ═══════════ */
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const T = {
  cards: (s)=>`<div class="section"><h3><span class="dot"></span>${s.title}${s.note?`<small>${s.note}</small>`:""}</h3><div class="cards">${s.items.map(i=>`<div class="card"><h4>${i.h}</h4><p>${i.p}</p></div>`).join("")}</div></div>`,
  vocab: (s)=>`<div class="section"><h3><span class="dot"></span>${s.title}</h3><div class="vocab-grid">${s.items.map(i=>`<div class="vocab"><div><span class="w">${i.word}</span><span class="ph">${i.phon||""}</span></div><div class="cn">${i.cn}</div>${i.note?`<div class="note">${i.note}</div>`:""}</div>`).join("")}</div></div>`,
  phrases:(s)=>`<div class="section"><h3><span class="dot"></span>${s.title}${s.note?`<small>${s.note}</small>`:""}</h3>${s.items.map(i=>`<div class="phrase"><div class="en">${i.en}</div><div class="cn">${i.cn}</div>${i.note?`<div class="note">💡 ${i.note}</div>`:""}</div>`).join("")}</div>`,
  fix:  (s)=>`<div class="section"><h3><span class="dot"></span>${s.title}</h3>${s.items.map(i=>`<div class="fix"><div class="row"><span class="bad">${i.bad}</span><span class="arr">→</span><span class="good">${i.good}</span></div><div class="cn">${i.cn}</div></div>`).join("")}</div>`,
  essay:(s)=>`<div class="section"><h3><span class="dot"></span>${s.title}</h3><div class="essay"><div class="en">${s.en}</div><div class="cn">${s.cn}</div></div></div>`,
  tips: (s)=>`<div class="section"><h3><span class="dot"></span>${s.title}</h3><div class="tips">${s.items.map(i=>`<div class="tip"><div class="ic">${i.ic}</div><div><h4>${i.h}</h4><p>${i.p}</p></div></div>`).join("")}</div></div>`,
  dialogue:(s)=>`<div class="section"><h3><span class="dot"></span>${s.title}</h3><div class="dlg">${s.lines.map((l,idx)=>`<div class="dlg-line ${idx%2?"me":""}"><div class="who">${esc(l.who)}</div><div class="bubble"><div class="en">${l.en}</div>${l.cn?`<div class="cn">${l.cn}</div>`:""}</div></div>`).join("")}</div></div>`
};

function shortTitle(t){ const s = t.split("：")[0]; return s.length>16 ? s.slice(0,16)+"…" : t; }

function renderNav(active){
  let h = LESSONS.map(l=>
    `<a class="lesson-link ${active==="lesson"+l.id?"active":""}" data-href="#/lesson/${l.id}">
       <div class="num">${l.id}</div>
       <div class="meta"><b>${esc(shortTitle(l.title))}</b><span>${esc(l.date)}</span></div>
     </a>`).join("");
  h += `<a class="lesson-link ${active==="words"?"active":""}" data-href="#/words">
       <div class="num ic">📖</div>
       <div class="meta"><b>医疗器械高频词 100</b><span>单词 + 例句 · 可发音</span></div>
     </a>`;
  document.getElementById("nav").innerHTML = h;
}

function lessonPage(l){
  const idx = LESSONS.findIndex(x=>x.id===l.id);
  const prev = LESSONS[idx-1], next = LESSONS[idx+1];
  return `
    <div class="crumb"><a data-href="#/">🏠 首页</a> / 第 ${l.id} 课</div>
    <div class="lesson-head">
      <span class="tag">LESSON ${l.id}</span>
      <h2>${esc(l.title)}</h2>
      <div class="date">📅 ${esc(l.date)} ｜ 👨‍🏫 ${esc(SITE.teacher)} ｜ 👤 ${esc(SITE.student)}</div>
      ${l.subtitle?`<div class="date" style="margin-top:4px">${esc(l.subtitle)}</div>`:""}
    </div>
    ${l.sections.map(s=>(T[s.type]||T.cards)(s)).join("")}
    <div class="pager">
      ${prev?`<a data-href="#/lesson/${prev.id}"><span>← 上一课</span><b>第 ${prev.id} 课 · ${esc(shortTitle(prev.title))}</b></a>`:"<a></a>"}
      <a class="next" data-href="#/words"><span>词汇专题 →</span><b>📖 医疗器械高频词 100</b></a>
    </div>
    <div class="footer-note">📒 ${esc(SITE.title)} · 每节课一页 · 持续更新</div>`;
}

function wordsPage(){
  const total = VOCAB100.reduce((n,g)=>n+g.items.length,0);
  return `
    <div class="crumb"><a data-href="#/">🏠 首页</a> / 高频词 100</div>
    <div class="lesson-head">
      <span class="tag">📖 词汇专题</span>
      <h2>医疗器械高频词 100</h2>
      <div class="date">共 ${total} 个高频词 ｜ 10 大分类 ｜ 单词 + 例句均带 🔊 发音</div>
      <div class="date" style="margin-top:4px">点 🔊 听发音（自动放慢语速，方便跟读模仿）</div>
      <div class="search-box"><span class="si">🔍</span><input type="text" placeholder="搜索单词 / 中文 / 例句，如：monitor、血压计、CE…" oninput="filterWords(this.value)"></div>
    </div>
    <div id="wordsArea">
    ${VOCAB100.map((g,gi)=>`
      <div class="section" data-group>
        <h3><span class="dot"></span>${g.c}<small>${g.items.length} 词</small></h3>
        <div class="words-wrap">
        ${g.items.map(it=>`
          <div class="vrow" data-k="${esc((it.w+" "+it.cn+" "+it.ex+" "+it.excn).toLowerCase())}">
            <div class="r1">
              <button class="spk" title="朗读单词" onclick="speak('${esc(it.w)}',true)">🔊</button>
              <span class="ww">${esc(it.w)}</span>
              <span class="ph">${it.ph}</span>
              <span class="cn">${esc(it.cn)}</span>
            </div>
            <div class="r2">
              <button class="spk sm" title="朗读例句" onclick="speak('${esc(it.ex)}')">🔊</button>
              <span class="exen">${esc(it.ex)}</span>
              <span class="excn">${esc(it.excn)}</span>
            </div>
          </div>`).join("")}
        </div>
      </div>`).join("")}
    </div>
    <div class="pager">
      ${LESSONS.length?`<a data-href="#/lesson/${LESSONS[LESSONS.length-1].id}"><span>← 返回课程</span><b>第 ${LESSONS[LESSONS.length-1].id} 课 · ${esc(shortTitle(LESSONS[LESSONS.length-1].title))}</b></a>`:"<a></a>"}
      <a class="next" data-href="#/"><span>回到首页 →</span><b>🏠 课程目录</b></a>
    </div>
    <div class="footer-note">📒 ${esc(SITE.title)} · 每节课一页 · 持续更新</div>`;
}

function filterWords(kw){
  kw = (kw||"").trim().toLowerCase();
  document.querySelectorAll("#wordsArea [data-group]").forEach(g=>{
    let visible = 0;
    g.querySelectorAll(".vrow").forEach(r=>{
      const show = !kw || r.getAttribute("data-k").indexOf(kw) > -1;
      r.classList.toggle("hidden", !show);
      if(show) visible++;
    });
    g.classList.toggle("hidden", visible===0);
  });
}

function homePage(){
  return `
    <div class="hero">
      <div class="logo">📒</div>
      <h2>${esc(SITE.title)}</h2>
      <p>${esc(SITE.intro)}</p>
    </div>
    <div class="stat-row">
      <div class="stat"><b>${LESSONS.length}</b><span>已更新课程</span></div>
      <div class="stat"><b>${LESSONS.reduce((n,l)=>n+l.sections.length,0)}</b><span>知识模块</span></div>
      <div class="stat"><b>100</b><span>医疗器械高频词</span></div>
    </div>
    <div class="lesson-cards">
      ${LESSONS.map(l=>`<a class="lc" data-href="#/lesson/${l.id}">
          <div class="num">LESSON ${l.id} · ${esc(l.date)}</div>
          <h3>${esc(l.title)}</h3>
          <p>${esc(l.subtitle||"")}</p>
          <span class="go">进入复习 →</span>
        </a>`).join("")}
      <a class="lc special" data-href="#/words">
        <div class="num">📖 词汇专题</div>
        <h3>医疗器械高频词 100</h3>
        <p>10 大分类 · 外贸业务实战例句 · 单词例句都能点读发音</p>
        <span class="go">进入词汇库 →</span>
      </a>
    </div>
    <div class="footer-note">📒 ${esc(SITE.title)} · 每节课一页 · 持续更新</div>`;
}

function route(){
  const h = (location.hash || "#/").replace(/^#\/?/, "");
  const app = document.getElementById("app");
  const m = h.match(/^lesson\/(\d+)/);
  if(m){
    const l = LESSONS.find(x=>x.id===Number(m[1]));
    if(l){ renderNav("lesson"+l.id); app.innerHTML = lessonPage(l); window.scrollTo(0,0); return; }
  }
  if(h === "words"){ renderNav("words"); app.innerHTML = wordsPage(); window.scrollTo(0,0); return; }
  renderNav(null);
  app.innerHTML = homePage();
  window.scrollTo(0,0);
}

document.addEventListener("click", function(e){
  const a = e.target.closest("[data-href]");
  if(!a) return;
  e.preventDefault();
  const target = a.getAttribute("data-href");
  if(location.hash !== target){ location.hash = target; }
  route();
});
window.addEventListener("hashchange", route);

document.getElementById("siteTitle").textContent = SITE.title;
document.getElementById("siteSub").textContent = SITE.student + " 专属 · " + SITE.teacher + " · 持续更新";
route();
</script>
</body>
</html>
